name: README options

on:
  push:
    branches: [main]
    paths:
      - build-aseprite.ps1
      - README.md
      - .github/scripts/Update-ReadmeOptions.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-options
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate options table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate
        shell: pwsh
        run: ./.github/scripts/Update-ReadmeOptions.ps1

      - name: Commit
        run: |
          if git diff --quiet -- README.md; then
            echo "README options are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate README options"
          git push
